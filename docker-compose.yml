version: "3.8"
services:
  recommender:
    build:
      context: .
      dockerfile: Dockerfile
    image: resource-recommender:latest
    ports:
      - "8000:8000"
    volumes:
      - ./container_meta.csv:/app/container_meta.csv:ro
      - ./container_usage.csv:/app/container_usage.csv:ro
      - ./artifacts:/app/artifacts
    environment:
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "8000"
      FORCE_RETRAIN: "0"
    restart: unless-stopped
